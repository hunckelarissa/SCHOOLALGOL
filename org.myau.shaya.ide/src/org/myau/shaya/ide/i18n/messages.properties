Shortcuts_shellTitle=ALG Shortcuts
Shortcuts_body=ALG / SCHOOLALGOL — keyboard shortcuts\n\nRun\n  Ctrl+Alt+R          Run (.alg)\n  Ctrl+Alt+C          Check (lex + parse)\n  Ctrl+Alt+T          Transpile (.alg \u2192 .c)\n  Ctrl+Alt+L          Run Last\n  Ctrl+Alt+Shift+D    Step Debug (SHAYDBG)\n  Run As \u2192 ALG Application\n  ALG \u2192 Recent \u2192 Open / Clear Recent\n  ALG \u2192 Welcome\u2026\n\nEdit\n  F3 / Ctrl+Click   Go to Declaration\n  Ctrl+O            Quick Outline\n  Ctrl+Shift+G      Find References (identifiers; skips keywords/strings)\n  Alt+Shift+R       Rename\u2026 (same limits)\n  Ctrl+Shift+F      Reindent\n  Ctrl+/            Toggle Comment (|)\n  Ctrl+Shift+P      Go to Matching Block\n  Ctrl+Shift+E      Expand Selection to Block\n  Ctrl+D            Duplicate Lines\n  Alt+\u2191 / Alt+\u2193     Move Lines Up / Down\n  Ctrl+Alt+J        Join Lines\n  Alt+Shift+S       Sort Lines\n  Ctrl+Space        Templates + keywords (RU/EN)\n  Enter             Auto-indent after begin/if/loop / \u043d\u0430\u0447/\u0435\u0441\u043b\u0438/\u043d\u0446\u2026\n  Console           click file:line / line N \u2192 source\n\nProject\n  File \u2192 New \u2192 Project \u2192 ALG Project\n  File \u2192 New \u2192 ALG \u2192 ALG Hello\n  Window \u2192 Perspective \u2192 ALG\n  Preferences \u2192 ALG (Toolchain home, Validate\u2026)\n  .alg \u2192 SCHOOLALGOL\n

